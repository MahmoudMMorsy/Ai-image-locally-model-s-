name: Collect pixel-art dataset

on:
  workflow_dispatch:
    inputs:
      max_images:
        description: "Maximum images for this run"
        required: false
        default: "1000"
  push:
    paths:
      - ".github/workflows/collect-pixel-dataset.yml"
      - "nano arcked dat/scripts/**"
      - "nano arcked dat/manifests/source_catalog.json"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install image inspection dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Collect
        env:
          MAX_IMAGES: ${{ github.event.inputs.max_images || '1000' }}
          MAX_FILE_MB: "8"
        run: python "nano arcked dat/scripts/collect_cc0_sources.py"

      - name: Commit collected dataset
        run: |
          git config user.name "nano-arcked-dataset-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "nano arcked dat/images" "nano arcked dat/metadata" "nano arcked dat/manifests"
          if git diff --cached --quiet; then
            echo "No new dataset files."
            exit 0
          fi
          git commit -m "dataset: collect pixel-art image batch"
          git push
