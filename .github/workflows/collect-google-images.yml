name: Collect Pixel Art from Google Images

on:
  workflow_dispatch:
    inputs:
      results_per_query:
        description: 'Google image results per query (max 10 per API request)'
        required: true
        default: '10'
      max_downloads:
        description: 'Maximum total downloads for this run'
        required: true
        default: '100'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect Google Images results
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          RESULTS_PER_QUERY: ${{ inputs.results_per_query }}
          MAX_DOWNLOADS: ${{ inputs.max_downloads }}
        run: |
          if [ -z "$GOOGLE_API_KEY" ] || [ -z "$GOOGLE_CSE_ID" ]; then
            echo 'Missing repository secrets GOOGLE_API_KEY and/or GOOGLE_CSE_ID.'
            echo 'Add them in Settings > Secrets and variables > Actions, then rerun this workflow.'
            exit 1
          fi
          python scripts/collect_google_pixel_art.py

      - name: Commit newly collected images and metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f 'nano arcked dat/google_images'
          if git diff --cached --quiet; then
            echo 'No new files to commit.'
          else
            git commit -m 'Collect pixel-art images from Google Images'
            git push
          fi
